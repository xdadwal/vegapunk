[project]
name = "vegapunk"
version = "0.1.0"
description = "Manage a homelab host and its services through a web interface."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "docker>=7.2.0",
    "fastapi",
    "logpose",
    "psutil>=7.2.2",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["vegapunk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A regression guard, not a target: about 3 points under the measured total (97.8% on
# 2026-11-27). Raise it when coverage rises; do not lower it to make a change pass.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
logpose = { git = "https://github.com/xdadwal/logpose.git", rev = "v0.2.0" }
