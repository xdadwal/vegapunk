version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps:"
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose so new icons match the design system's drawing style (AGENTS.md,
      # "Design decisions"). Upgrade by hand, together with the icon set.
      - dependency-name: lucide-react
    commit-message:
      prefix: "deps:"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps:"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Stay on Python 3.12 and Node 24, the versions the project is built for.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps:"
    labels: [dependencies]
