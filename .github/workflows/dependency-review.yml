# Blocks pull requests that add dependencies with known high or critical
# vulnerabilities. Needs the repository's dependency graph (on by default
# for public repositories).
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Fork PRs get a read-only token, so the comment cannot be posted there; same-repo PRs get it.
          comment-summary-in-pr: on-failure
