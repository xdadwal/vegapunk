services:
  vegapunk:
    container_name: vegapunk
    build: .
    # The host port. Set VEGAPUNK_PORT to use another one if 8000 is taken.
    ports:
      - "${VEGAPUNK_PORT:-8000}:8000"
    volumes:
      - vegapunk-data:/data
      # Vegapunk reads container state and usage from Docker. Read the README before
      # changing this: the socket gives this container control of Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    # The group that owns the socket. On Linux it is the docker group, whose id differs
    # per host: DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose up -d
    group_add:
      - "${DOCKER_GID:-0}"
    # So the agent can reach a model server running on this host, such as Ollama, at
    # http://host.docker.internal:11434/v1 (Docker Desktop provides the name itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Stopping waits up to 3 s for open requests, then lets running answers end cleanly
    # (up to about 8 s more). Docker's default 10 s would cut that short.
    stop_grace_period: 20s

volumes:
  vegapunk-data:
